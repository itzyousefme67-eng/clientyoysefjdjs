name: Build JAR

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Extract ZIP files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -iname '*.zip' \
            -not -path './.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -not -path '*-extracted/*' -print0 |
          while IFS= read -r -d '' zipfile; do
            echo "Extracting: $zipfile"
            dest="${zipfile%.zip}-extracted"
            mkdir -p "$dest"
            unzip -o "$zipfile" -d "$dest"
          done

      - name: Find project and build JAR
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE=$(find . -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No Gradle project found after extracting ZIP files."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          echo "Building project in: $PWD"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --stacktrace --no-daemon
          else
            gradle build --stacktrace --no-daemon
          fi

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
